name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FLUTTER_VERSION: 3.50.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build APK (arm64)
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --build-name 1.0.${{ github.run_number }} --build-number ${{ github.run_number }} \
            --dart-define=STRIPE_PAYMENT_LINK=${{ vars.STRIPE_PAYMENT_LINK }}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk slotwise.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: slotwise.apk

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build web
        run: |
          flutter build web --release --no-web-resources-cdn --base-href /slotwise/ \
            --dart-define=STRIPE_PAYMENT_LINK=${{ vars.STRIPE_PAYMENT_LINK }}
          cp build/web/index.html build/web/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-web:
    if: github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  ios:
    needs: test
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build iOS simulator app
        run: |
          flutter build ios --simulator --debug --build-name 1.0.${{ github.run_number }}
          cd build/ios/iphonesimulator && zip -qr ../../../Slotwise-ios-simulator.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: Slotwise-ios-simulator.zip

  release:
    if: always() && github.ref == 'refs/heads/main' && needs.android.result == 'success'
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Slotwise 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            **Android:** download `slotwise.apk` and install it (allow installs from your browser).
            **iPhone simulator:** unzip `Slotwise-ios-simulator.zip` and drag `Runner.app` onto a booted simulator.
            **Web:** https://neomaverick1.github.io/slotwise/
          files: dist/*
